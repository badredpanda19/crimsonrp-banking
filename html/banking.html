<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Irongate Private Bank</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #07080a;
      --panel: #0d0f12;
      --panel-2: #12141a;
      --border: rgba(180,155,100,0.22);
      --border-bright: #c8a84b;
      --ink: #e8e2d4;
      --ink-muted: #8a8070;
      --ink-faint: #4a4540;
      --gold: #c8a84b;
      --gold-dark: #8a6e28;
      --gold-light: #f0d98c;
      --green: #2ecc71;
      --red: #e74c3c;
      --shadow: 0 24px 64px rgba(0,0,0,.8), 0 4px 16px rgba(0,0,0,.5);
      --radius: 8px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: transparent; font-family: "IBM Plex Sans", system-ui, sans-serif; color: var(--ink); overflow: hidden; }
    body { display: none; align-items: center; justify-content: center; height: 100%; margin: 0; }

    /* ── Sheet ── */
    .sheet {
      position: relative;
      width: min(1200px, 96vw);
      height: 820px;
      background: radial-gradient(ellipse at 30% 20%, #1a1406 0%, #07080a 70%), var(--panel);
      border: 1.5px solid var(--border-bright);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Noise overlay */
    .sheet::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      border-radius: 12px;
    }

    /* ── Title bar ── */
    .titlebar {
      position: relative;
      z-index: 2;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px; background: #000;
      border-bottom: 1.5px solid var(--border-bright); flex-shrink: 0;
    }
    .titlebar-left { display: flex; align-items: center; gap: 14px; }
    .bank-logo {
      width: 36px; height: 36px; background: var(--gold); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: #000; font-weight: 900;
    }
    .titlebar h1 {
      font-family: "Playfair Display", Georgia, serif; font-size: 22px;
      letter-spacing: 2px; text-transform: uppercase; color: var(--gold);
    }
    .titlebar-right { display: flex; align-items: center; gap: 12px; }
    .session-badge {
      background: rgba(200,168,75,.12); border: 1px solid var(--border); border-radius: 4px;
      padding: 4px 10px; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--gold);
    }
    .close-btn {
      background: none; border: 1px solid var(--ink-faint); color: var(--ink-muted);
      border-radius: 4px; width: 28px; height: 28px; cursor: pointer;
      font-size: 12px; transition: all .2s;
    }
    .close-btn:hover { border-color: var(--red); color: var(--red); }

    /* ── Tab bar ── */
    .tabbar {
      position: relative; z-index: 2; display: flex; align-items: stretch;
      background: #000; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .tab {
      padding: 14px 22px; color: var(--ink-muted); font-family: "IBM Plex Mono", monospace;
      font-size: 11px; text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
      border-bottom: 2px solid transparent; transition: all .2s; white-space: nowrap;
    }
    .tab:hover { color: var(--ink); }
    .tab.active { color: var(--gold); border-bottom-color: var(--gold); }
    .tab-spacer { flex: 1; }
    .tab-info {
      padding: 14px 18px; font-family: "IBM Plex Mono", monospace; font-size: 11px;
      color: var(--ink-faint); display: flex; align-items: center; gap: 8px;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── Content ── */
    .content {
      position: relative; z-index: 1; flex: 1; overflow: auto; padding: 28px;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }

    /* ── Section heading ── */
    .sec-head { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .sec-head h2 {
      font-family: "Playfair Display", Georgia, serif; font-size: 16px; font-weight: 700;
      color: var(--gold); text-transform: uppercase; letter-spacing: 1.5px;
    }
    .sec-head::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ── Card ── */
    .card { background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; }
    .card-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .card-header h3 { font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ink-muted); }
    .card-body { padding: 18px; }

    /* ── Account cards ── */
    .account-cards { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin-bottom: 28px; }
    .acct-card {
      background: linear-gradient(135deg, #12141a 0%, #1a1c22 100%); border: 1px solid var(--border);
      border-radius: 10px; padding: 20px; cursor: default; position: relative; overflow: hidden;
    }
    .acct-card.active-branch { border-color: var(--gold); background: linear-gradient(135deg, #1a1c22 0%, #2a2c32 100%); }
    .acct-card.active-branch::before { content: 'CURRENT'; position: absolute; top: 10px; right: 10px; font-family: "IBM Plex Mono", monospace; font-size: 8px; color: var(--gold); border: 1px solid var(--gold); padding: 2px 4px; border-radius: 3px; }

    .acct-balance { font-size: 26px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
    .acct-number { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-faint); letter-spacing: 2px; }
    .acct-icon { position: absolute; top: 16px; right: 16px; font-size: 20px; color: var(--gold); opacity: .4; }

    /* ── Inputs & Buttons ── */
    .input {
      width: 100%; padding: 10px 14px; background: #000; color: var(--ink);
      border: 1px solid var(--border); border-radius: var(--radius);
      font-family: "IBM Plex Sans", sans-serif; font-size: 13px; outline: none; transition: border-color .2s;
    }
    .input:focus { border-color: var(--gold); }
    .input::placeholder { color: var(--ink-faint); }
    .label { font-family: "IBM Plex Mono", monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-muted); margin-bottom: 6px; display: block; }
    .form-group { margin-bottom: 16px; }

    .btn {
      padding: 10px 18px; border-radius: 5px; cursor: pointer; border: none;
      font-family: "IBM Plex Sans", sans-serif; font-size: 13px; font-weight: 600; transition: all .18s;
    }
    .btn-gold { background: var(--gold); color: #000; }
    .btn-gold:hover { background: var(--gold-light); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--ink-muted); }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); }
    .btn-danger { background: transparent; border: 1px solid var(--red); color: var(--red); }
    .btn-danger:hover { background: var(--red); color: #fff; }
    .btn-full { width: 100%; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    /* ── Animations ── */
    @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    .animate-in { animation: fadeUp .3s ease both; }
    .animate-in:nth-child(1){animation-delay:.05s}
    .animate-in:nth-child(2){animation-delay:.1s}
    .animate-in:nth-child(3){animation-delay:.15s}
    .animate-in:nth-child(4){animation-delay:.2s}
    .animate-in:nth-child(5){animation-delay:.25s}
    .animate-in:nth-child(6){animation-delay:.3s}

    /* ── Modal ── */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:999999; align-items:center; justify-content:center; }
    .modal-overlay.open { display:flex; }
    .modal { background:#0d0f12; border:1px solid var(--border-bright); border-radius:12px; padding:28px; width:440px; position:relative; box-shadow: 0 32px 80px rgba(0,0,0,.8); }
    .modal h3 { font-family:"Playfair Display",serif; font-size:18px; color:var(--gold); margin-bottom:20px; }
    .modal-close { position:absolute; top:16px; right:18px; background:none; border:none; cursor:pointer; color:var(--ink-faint); font-size:18px; }
    .modal-close:hover { color:var(--red); }
  </style>
</head>
<body>
<div class="sheet">
  <div class="titlebar">
    <div class="titlebar-left">
      <div class="bank-logo"><i class="fa-solid fa-landmark"></i></div>
      <h1>Irongate Private Bank</h1>
    </div>
    <div class="titlebar-right">
      <div class="session-badge"><i class="fa-solid fa-shield-halved" style="margin-right:5px;"></i>SESSION SECURE</div>
      <div class="session-badge" id="ui-account-id">ACC: •••• 0000</div>
      <button class="close-btn" onclick="closeBankUI()">✕</button>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab active" data-tab="accounts" onclick="loadTab('accounts')">
      <i class="fa-solid fa-wallet" style="margin-right:6px;"></i>Accounts
    </div>
    <div class="tab-spacer"></div>
    <div class="tab-info"><div class="status-dot"></div><span id="currentTime"></span></div>
  </div>

  <div class="content" id="tabContent"></div>
</div>

<script>
  window.state = {
    accounts: [],
    selectedAcct: null,
    bankData: null,
    _isRendering: false,
  };

  function fmt(n) {
    const val = parseFloat(n) || 0;
    return (val < 0 ? '-' : '') + '$' + Math.abs(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function loadTab(tab, force = false) {
    if (window.state._isRendering && !force) return;
    window.state._isRendering = true;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    const el = document.getElementById('tabContent');
    if (!el) { window.state._isRendering = false; return; }
    const fns = { accounts: renderAccounts };
    if (fns[tab]) el.innerHTML = fns[tab]();
    window.state._isRendering = false;
  }

  function renderAccounts() {
    if (!window.state.bankData) return '<div style="color:var(--ink-muted);padding:20px;">Loading bank data...</div>';
    let all = window.state.bankData.allbanks;
    if (!all) return '<div style="color:var(--ink-muted);padding:20px;">No accounts found.</div>';
    if (!Array.isArray(all)) all = Object.values(all);

    const config = window.state.bankData.config || {};
    const salaries = (window.state.bankData.bankinfo && window.state.bankData.bankinfo.salaries) || [];
    const totalSalary = (window.state.bankData.bankinfo && window.state.bankData.bankinfo.salary) || 0;

    return `
    <div class="sec-head animate-in"><h2>Your Accounts</h2></div>
    <div class="account-cards animate-in">
      ${all.map(a=>`
        <div class="acct-card ${a.name === window.state.bankData.bankName ? 'active-branch' : ''}">
          <div class="acct-icon"><i class="fa-solid fa-money-check-dollar"></i></div>
          <div class="acct-type">${a.name} ${a.name === window.state.bankData.bankName ? '(Current)' : ''}</div>
          <div class="acct-balance">${fmt(a.money)}</div>
          <div class="acct-number">Gold: ${a.gold.toFixed(2)}</div>
        </div>
      `).join('')}
    </div>

    ${totalSalary > 0 ? `
    <div class="sec-head animate-in"><h2>Unpaid Salary</h2></div>
    <div class="card animate-in"><div class="card-body">
        <div style="display:flex; flex-direction:column; gap:12px; margin-bottom:16px;">
           ${salaries.map(s => `
             <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:8px;">
               <div><div class="stat-label">${s.name}</div><div class="stat-val" style="color:var(--green); font-size:18px;">${fmt(s.amount)}</div></div>
             </div>
           `).join('')}
        </div>
        <div style="display:flex; align-items:center; justify-content:space-between; border-top:1.5px solid var(--border-bright); padding-top:16px;">
           <div><div class="stat-label">Total to collect</div><div class="stat-val" style="color:var(--gold); font-size:22px;">${fmt(totalSalary)}</div></div>
           <button class="btn btn-gold" onclick="doAction('collectSalary')"><i class="fa-solid fa-hand-holding-dollar" style="margin-right:8px;"></i>Collect All</button>
        </div>
    </div></div>` : ''}

    <div class="sec-head animate-in"><h2>Quick Actions</h2></div>
    <div class="card animate-in"><div class="card-body" style="display:flex;flex-wrap:wrap;gap:10px;">
        <button class="btn btn-gold" style="flex:1; min-width: 150px;" onclick="doAction('depositCash')"><i class="fa-solid fa-money-bill-wave" style="margin-right:8px;"></i>Deposit Cash</button>
        <button class="btn btn-outline" style="flex:1; min-width: 150px;" onclick="doAction('withdrawCash')"><i class="fa-solid fa-money-bill-1" style="margin-right:8px;"></i>Withdraw Cash</button>
        ${config.gold ? `
        <button class="btn btn-gold" style="flex:1; min-width: 150px;" onclick="doAction('depositGold')"><i class="fa-solid fa-coins" style="margin-right:8px;"></i>Deposit Gold</button>
        <button class="btn btn-outline" style="flex:1; min-width: 150px;" onclick="doAction('withdrawGold')"><i class="fa-solid fa-coins" style="margin-right:8px;"></i>Withdraw Gold</button>
        ` : ''}
    </div></div>`;
  }

  function doAction(action) {
    if (action === 'collectSalary') {
        fetch(`https://${GetParentResourceName()}/collectSalary`, { method: 'POST', body: JSON.stringify({ city: window.state.bankData.bankName }) });
        return;
    }
    const modal = document.getElementById('modal-action') || (() => {
      const m = document.createElement('div'); m.id = 'modal-action';
      m.style.cssText = 'display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999999;align-items:center;justify-content:center;';
      m.innerHTML = `<div style="background:var(--panel);border:1.5px solid var(--border-bright);border-radius:8px;padding:28px;min-width:320px;text-align:center;">
        <h3 style="color:var(--gold);font-family:'Playfair Display',serif;margin-bottom:16px;" id="action-title">Enter Amount</h3>
        <input id="action-input" type="number" min="0" step="0.01" style="width:100%;padding:10px;background:var(--panel-2);border:1px solid var(--border-bright);color:var(--ink);border-radius:4px;font-size:16px;margin-bottom:16px;" placeholder="0.00" />
        <div style="display:flex;gap:10px;"><button class="btn btn-outline" style="flex:1;" onclick="document.getElementById('modal-action').style.display='none'">Cancel</button><button class="btn btn-gold" style="flex:1;" id="action-confirm">Confirm</button></div>
      </div>`;
      document.body.appendChild(m); return m;
    })();
    const titles = { depositCash:'Deposit Cash', withdrawCash:'Withdraw Cash', depositGold:'Deposit Gold', withdrawGold:'Withdraw Gold' };
    document.getElementById('action-title').textContent = titles[action] || 'Enter Amount';
    document.getElementById('action-input').value = '';
    modal.style.display = 'flex';
    document.getElementById('action-confirm').onclick = function() {
      const amount = parseFloat(document.getElementById('action-input').value);
      if (!amount || amount <= 0) return;
      modal.style.display = 'none';
      fetch(`https://${GetParentResourceName()}/${action}`, { method: 'POST', body: JSON.stringify({ amount: amount, city: window.state.bankData.bankName, bankinfo: window.state.bankData.bankinfo }) });
    };
  }

  function closeBankUI() { fetch(`https://${GetParentResourceName()}/close`, { method: 'POST', body: JSON.stringify({}) }); }
  function updateTime() { document.getElementById('currentTime').textContent = new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
  setInterval(updateTime, 1000); updateTime();

  window.addEventListener('message', function(event) {
    const data = event.data;
    if (data.type === 'open') {
        const wasOpen = document.body.style.display === 'flex';
        window.state.bankData = data;
        if (data.bankinfo && data.bankinfo.accountID) document.getElementById('ui-account-id').textContent = data.bankinfo.accountID;
        document.body.style.display = 'flex';
        loadTab('accounts', true);
    } else if (data.type === 'close') {
        document.body.style.display = 'none';
        window.state.bankData = null;
    }
  });
</script>
</body>
</html>
